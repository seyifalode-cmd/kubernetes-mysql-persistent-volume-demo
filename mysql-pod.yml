apiVersion: v1
kind: Pod
metadata:
  name: mysql
spec:
  containers:
  - name: mysql
    image: mysql:5.7
    env:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:      # created with: kubectl create secret generic mysql-root --from-literal=password='<strong-password>'
          name: mysql-root
          key: password
    volumeMounts:
    - name: mysql-storage
      mountPath: /var/lib/mysql
  restartPolicy: Always
  volumes:
  - name: mysql-storage
