apiVersion: v1
kind: Pod
metadata:
  name: mysql
spec:
  containers:
  - name: mysql
    image: mysql:5.7
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: YUCloudOps20XY!
    volumeMounts:
    - name: mysql-storage
      mountPath: /var/lib/mysql
  restartPolicy: Always
  volumes:
  - name: mysql-storage
